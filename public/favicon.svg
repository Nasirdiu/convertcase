<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#grad)" filter="url(#shadow)" />
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- "A" uppercase -->
  <text x="21" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">A</text>
  
  <!-- "a" lowercase in bright cyan accent -->
  <text x="43" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#93c5fd" text-anchor="middle">a</text>
</svg>
